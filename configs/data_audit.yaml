project:
  name: Prédiction du risque de santé mentale chez les étudiants
  environment: development

data:
  raw_path: data/raw/student_mental_health.csv
  encoding: utf-8
  separator: ","
  target_column: Mental_Health_Risk
  id_columns: ["Student_ID"]
  model_path_save: artifacts/model/best_model.joblib

audit:
  check_missing_values: True
  check_duplicates: True
  check_inconsistencies: True
  check_outliers: True
  descriptive_statistics: True
  target_distribution: True
  calculate_correlations: True

  outliers:
    method: iqr
    multiplier: 1.5
    action: report_only

  missing_values:
    warning_threshold: 0.05
    critical_threshold: 0.30

  cardinality:
    max_categories_for_crosstab: 30

report:
  output_dir: artifacts/reports
  filename: data_audit_report.json
  save_json: True

preprocessing:
  numerical:
    numerical_columns: ["Age","Year_of_Study","Sleep_Hours","Study_Hours_Per_Week","GPA","Social_Media_Hours","Screen_Time_Hours","Financial_Stress","Family_Support","Attendance_Rate"]
    imputation_strategy: median
    scaling_strategy: standard

  ordinal:
    ordinal_columns: ["Physical_Activity" , "Diet_Quality"]
    ordinal_categorie: [['Low', 'Moderate', 'High'], ['Poor', 'Average', 'Good']]
    imputation_strategy: most_frequent
    encoding_strategy: ordinal
    unknown_value: -1

  nominal:
    nominal_columns: ["Gender" , "Part_Time_Job" , "Previous_Mental_Health_History"]
    imputation_strategy: most_frequent
    encoding_strategy: onehot
    handle_unknown: ignore
  
  split:
    test_size: 0.20
    random_state: 42

train:
  models:
    logistic_regression:
      max_iter: 1000
    
    random_forest:
      n_estimators: 200
    
    svc:
      kernel: rbf
      probability: true

    random_state: 42

cv:
  n_splits: 5
  shuffle: True
  random_state: 42

grid:
  parametre_grids:
    logistic_regression:
      "model__C": [0.1, 1.0, 10.0]
      "model__solver": ["lbfgs"]
    
    "random_forest": 
          "model__n_estimators": [200, 400]
          "model__max_depth": [None, 10, 20]
          "model__min_samples_split": [2, 5]

    "svc": 
          "model__C": [0.1, 1.0, 10.0],
          "model__gamma": ["scale", "auto"],
  
  scoring: f1_macro
  refit: True
  return_train_score: True
  error_score: raise

logging:
  level: INFO
  directory: logs
  filename: data_audit.log   